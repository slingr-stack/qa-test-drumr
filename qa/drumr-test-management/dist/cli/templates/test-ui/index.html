function openAddCaseModal(planId, cycleId) {
  const plan  = S.plans.find(p => p.id === planId);
  const cycle = plan?.cycles.find(c => c.id === cycleId);
  if (!cycle) return;

  const grouped = {};
  for (const t of S.collectedTests) {
    if (!grouped[t.type]) grouped[t.type] = [];
    grouped[t.type].push(t);
  }
  let optionsHtml = '<option value="">— custom case —</option>';
  for (const [type, tests] of Object.entries(grouped)) {
    optionsHtml += `<optgroup label="${type.toUpperCase()}">`;
    for (const t of tests) {
      optionsHtml += `<option value="${esc(t.displayName)}" data-spec="${esc(t.specFile)}" data-test="${esc(t.testName)}" data-full-name="${esc(t.fullName || '')}">${esc(t.displayName)}</option>`;
    }
    optionsHtml += '</optgroup>';
  }

  const html = `
    <div class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Add Case to "${esc(cycle.name)}"</h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">From Test Cases</label>
            <select id="modal-collected" class="form-select" onchange="onCollectedSelect(this)">${optionsHtml}</select>
          </div>
          <div class="form-group">
            <label class="form-label">Case Name</label>
            <input id="modal-name" class="form-input" placeholder="Test case name" />
          </div>
          <div class="form-group">
            <label class="form-label">Spec File <span class="form-hint">(optional)</span></label>
            <input id="modal-spec" class="form-input" placeholder="e.g. frontend/tests/e2e/auth.spec.ts" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="addCase('${escJsAttr(planId)}','${escJsAttr(cycleId)}')">Add Case</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-container').innerHTML = html;
}

function onCollectedSelect(sel) {
  const opt = sel.options[sel.selectedIndex];
  const nameEl = document.getElementById('modal-name');
  const specEl = document.getElementById('modal-spec');
  if (!nameEl || !specEl) return;

  if (sel.value) {
    nameEl.value = sel.value;
    nameEl.dataset.test = opt.dataset.test || '';
    nameEl.dataset.fullName = opt.dataset.fullName || '';
    specEl.value = opt.dataset.spec || '';
  } else {
    delete nameEl.dataset.test;
    delete nameEl.dataset.fullName;
  }
}

function addCase(planId, cycleId) {
  const nameEl = document.getElementById('modal-name');
  const name = nameEl?.value?.trim();
  if (!name) { showToast('Please enter a case name.', 'error'); return; }
  const testName = nameEl?.dataset?.test?.trim() || undefined;
  const fullName = nameEl?.dataset?.fullName?.trim() || undefined;
  const spec   = document.getElementById('modal-spec')?.value?.trim() || undefined;
  const plan   = S.plans.find(p => p.id === planId);
  const cycle  = plan?.cycles.find(c => c.id === cycleId);
  if (!cycle) return;
  const allCases = S.plans.flatMap(p => p.cycles.flatMap(c => c.cases));
  const id = nextId('TC', allCases);
  cycle.cases.push({ id, name, testName, fullName, specFile: spec, status: 'pending', steps: [] });
  saveTestPlans();
  closeModal();
  render();
  showToast(`Case "${name}" added`, 'success');
}

function openAddToPlanModal(event) {
  const test = readTestPayload(event?.currentTarget?.dataset?.test);
  if (!test) return;

  let optHtml = '';
  for (const plan of S.plans) {
    optHtml += `<optgroup label="${esc(plan.name)}">`;
    for (const cycle of plan.cycles) {
      optHtml += `<option value="${plan.id}|${cycle.id}">${esc(cycle.name)}</option>`;
    }
    optHtml += '</optgroup>';
  }

  const html = `
    <div class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>Add to Test Plan</h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Test</label>
            <div style="font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;">${esc(test.displayName)}</div>
          </div>
          <div class="form-group">
            <label class="form-label">Add to Cycle</label>
            ${S.plans.length === 0
              ? `<div style="font-size:12px;color:var(--text-muted);">No test plans yet. Create one first.</div>`
              : `<select id="modal-cycle-target" class="form-select">${optHtml}</select>`}
          </div>
          ${S.plans.length > 0 ? `
          <div class="form-group">
            <label class="form-label">Case Name</label>
            <input id="modal-name" class="form-input" value="${esc(test.displayName)}" />
          </div>` : ''}
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          ${S.plans.length > 0
            ? `<button class="btn btn-primary" onclick="addCollectedToPlan()">Add</button>`
            : `<button class="btn btn-secondary" onclick="closeModal()">Close</button>`}
        </div>
      </div>
    </div>`;
  const modalContainer = document.getElementById('modal-container');
  modalContainer.dataset.test = encodeURIComponent(JSON.stringify(test));
  modalContainer.innerHTML = html;
}

function addCollectedToPlan() {
  const modalContainer = document.getElementById('modal-container');
  const test = readTestPayload(modalContainer?.dataset?.test);
  if (!test) return;
  const cycleTarget = document.getElementById('modal-cycle-target')?.value;
  const name = document.getElementById('modal-name')?.value?.trim() || test.displayName;
  if (!cycleTarget || !name) return;
  const [planId, cycleId] = cycleTarget.split('|');
  const plan  = S.plans.find(p => p.id === planId);
  const cycle = plan?.cycles.find(c => c.id === cycleId);
  if (!cycle) return;
  const allCases = S.plans.flatMap(p => p.cycles.flatMap(c => c.cases));
  const id = nextId('TC', allCases);
  cycle.cases.push({ id, name, specFile: test.specFile, testName: test.testName, fullName: test.fullName, status: 'pending', steps: [] });
  saveTestPlans();
  closeModal();
  render();
  showToast(`Added to ${plan.name} / ${cycle.name}`, 'success');
}

function closeModal(event) {
  if (event && event.target !== event.currentTarget) return;
  const modalContainer = document.getElementById('modal-container');
  delete modalContainer.dataset.test;
  modalContainer.innerHTML = '';
}

function readTestPayload(payload) {
  if (!payload) return null;
  try {
    return JSON.parse(decodeURIComponent(payload));
  } catch {
    showToast('Could not read the selected test case.', 'error');
    return null;
  }
}

// keyboard close
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
window.addEventListener('beforeunload', stopRunPolling);

// ─── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, type = 'info') {
  const c  = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 3000);
}

// ─── Loading ──────────────────────────────────────────────────────────────────
function showLoading(msg) {
  document.getElementById('loading-text').textContent = msg;
  document.getElementById('loading-overlay').classList.remove('hidden');
}
function hideLoading() {
  document.getElementById('loading-overlay').classList.add('hidden');
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return esc(s).replace(/'/g, '&#39;');
}

function escJsAttr(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n')
    .replace(/\u2028/g, '\\u2028')
    .replace(/\u2029/g, '\\u2029');
}

function breadcrumb(parts) {
  return parts.map((p, i) =>
    `<span class="breadcrumb-item ${i === parts.length-1 ? 'active' : ''}">${esc(p)}</span>`
    + (i < parts.length-1 ? '<span class="breadcrumb-sep">/</span>' : '')
  ).join('');
}

function emptyState(title, desc) {
  return `<div class="empty-state">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
    </svg>
    <h3>${title}</h3><p>${desc}</p></div>`;
}

// ─── Inline SVG Icons ─────────────────────────────────────────────────────────
function iconChevron() {
  return `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
}
function iconPlus(s) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
}
function iconTrash() {
  return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
}
function iconFolder(open) {
  return open
    ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`
    : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7d8590" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
}
function iconCycle() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`;
}
function iconCycleInline() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`;
}
function iconBeaker() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#56d364" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v11l-5 5a2 2 0 0 0 1.4 3.4h13.2A2 2 0 0 0 20 19l-5-5V3"/></svg>`;
}
function iconPlay(s) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
}
function iconMove(s) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 18 12 21 15 18"/><line x1="2" y1="12" x2="12" y2="12"/><line x1="12" y1="21" x2="12" y2="11"/></svg>`;
}

// ─── Boot ────────────────────────────────────────────────────────────────────
applyTheme(getPreferredTheme());
setupLayoutResizers();
loadState();
</script>
</body>
</html>
